name: Earthquake monitor

# A real pipeline on real data: every 12 hours, fetch every M >= 2.5
# earthquake on Earth from the USGS real-time Feed API, aggregate it with
# examples/04_earthquake_monitor.py, and commit the refreshed report to
# reports/earthquakes.md so the repo itself is the dashboard.
on:
  schedule:
    - cron: "0 */12 * * *" # at 00:00 and 12:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

# The default GITHUB_TOKEN is read-only; the report commit needs write.
permissions:
  contents: write

# If a scheduled run overlaps a manual one, let the newer run win.
concurrency:
  group: earthquake-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: run the earthquake monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the pipeline (fetch + aggregate + report)
        run: python -m pipedream run examples/04_earthquake_monitor.py
      - name: Commit the refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/earthquakes.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "earthquake monitor: refresh report [skip ci]"
            git push
          fi
