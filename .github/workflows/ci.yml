name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is Ubuntu 26.04, whose oldest Python build is 3.10;
        # pin the 3.9 leg to Ubuntu 24.04, which still ships 3.9 builds.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling (the library itself has zero dependencies)
        run: python -m pip install --upgrade pip pytest
      - name: Run the test suite
        run: pytest -v

  examples:
    name: example pipelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run every example pipeline end to end
        run: |
          for pipeline in examples/*.py; do
            echo "::group::python -m pipedream run $pipeline"
            python -m pipedream run "$pipeline" --no-cache
            echo "::endgroup::"
          done

  stdlib-audit:
    name: zero-dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prove only the standard library is imported
        run: python -S scripts/audit_stdlib.py
